<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Event</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <form action="">
        <h2>
          오늘, 당신의 마음을<br />
          움직일 영화는 무엇인가요?<br />
          영화 기대평 남기면<br />
          영화예매권 드립니다!
        </h2>
        <div class="poster-row">
          <div class="poster">
            <div class="img-frame">
              <img
                src="https://i.namu.wiki/i/rCWZEdiH0KsHiY9ltICwR0Yk6Y3NZyLC4LuMNK73NBu_RI5LcAdxZTXyBd5ZLGwwObU1oR08OvOI4IhfRvcqWQtzCHq0_yb5aUlsAUxi31B09pvgdvWGJMRGvCXA162YC-A6ca3nrs3lXp2N_Ig2gg.webp"
                alt="img01"
              />
            </div>
            <label>
              <input type="radio" name="movie" value="Kpop" />
              <p>K-POP 데몬 헌터스</p>
            </label>
          </div>
          <div class="poster">
            <div class="img-frame">
              <img
                src="https://i.namu.wiki/i/pLuMX6mLfgCttw2nWS7UO116mcLeAHsU1jPDBlwskUuULleP7b59MQhgNX6OzNFZY1k8DubgsJXjY5hboS-vEFo8OA8pIdtLhjcRMLpyq4JAzrXmwqdRXY6X95BCIljFecPY_YL11LJVlQYUmgSe5Q.jpg"
                alt="img02"
              />
            </div>
            <label>
              <input type="radio" name="movie" value="Trigger" />
              <p>트리거</p>
            </label>
          </div>

          <div class="poster">
            <div class="img-frame">
              <img
                src="https://i.namu.wiki/i/nMT261y1Mr3zXJunZE4t074ru02JBFTLllmyr5mZz_oM7QAcl-4EdJpvojYCsZLSq8NlRkV84kaGgrMwpeJTuDdPX_Jgrew0B1-BEAHnH35KJJAjDjWQl7QWaBiTSkvwhShGed8zIPi2Fjt8kbpTTA.webp"
                alt="img03"
              />
            </div>
            <label>
              <input type="radio" name="movie" value="love" />
              <p>모태솔로지만 연애는 하고싶어</p>
            </label>
          </div>
        </div>
        <div class="outer">
          <label>
            1. 해당영화 선택이유
            <div class="inner">
              <input type="text" name="reason" required />
            </div>
          </label>
        </div>
        <div class="outer">
          <label>
            2. 참여자 이름
            <div class="inner"><input type="text" name="name" required /></div>
          </label>
        </div>
        <div class="outer">
          3. 성별
          <div class="inner gender">
            <label><input type="radio" value="male" />남성</label>
            <label><input type="radio" value="female" />여성</label>
          </div>
        </div>

        <div class="outer">
          4. 나이
          <div class="inner age">
            <label><input type="radio" name="age" value="10" />10대</label>
            <label><input type="radio" name="age" value="20" />20대</label>
            <label><input type="radio" name="age" value="30" />30대</label>
            <label><input type="radio" name="age" value="40" />40대</label>
            <label><input type="radio" name="age" value="50" />50대</label>
          </div>
        </div>
        <div class="outer">
          <label>
            5. 전화번호
            <div>
              <input
                type="text"
                name="phone"
                placeholder="01012345678"
                required
              />
            </div>
          </label>
        </div>
        <div class="outer">
          <label>
            6. 이메일
            <div class="inner"><input type="email" name="phone" /></div>
          </label>
        </div>
        <button type="submit">이벤트 참여하기</button>
      </form>
    </div>
  </body>
</html>
