
<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>산후조리원 위치 지도</title>
    <style>
      #map {
        width: 100%;
        height: 937px;
      }
    </style>
    <!-- Kakao Map SDK -->
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=6daadf066fd04372a46b5294ba1569a4&libraries=clusterer,services"></script>
  </head>
  <body>
    <div id="map"></div>
    <script>
      const url =
        "https://api.odcloud.kr/api/15004303/v1/uddi:398988c5-5a01-4445-b093-cbe6578456b8?page=1&perPage=100&serviceKey=oMLY3SekqYi6Z3IHiIY01u%2F5BYoy8D0%2Foxwm0wq%2BUI8u3qqZwutT5AuBlmd3bTIjc22dXkLGnEAjYKI2y2hRaQ%3D%3D&_returnType=JSON";

      fetch(url)
        .then((res) => res.json())
        .then((result) => {
          const data = result.data;

          const container = document.getElementById("map");
          const options = {
            center: new kakao.maps.LatLng(37.5665, 126.9780), // 서울 중심 기본 좌표
            level: 12,
          };
          const map = new kakao.maps.Map(container, options);

          const clusterer = new kakao.maps.MarkerClusterer({
            map: map,
            averageCenter: true,
            minLevel: 10,
          });

          const geocoder = new kakao.maps.services.Geocoder();
          const markers = [];

          // 주소를 좌표로 변환하고 마커 생성
          data.forEach((item, index) => {
            const address = item.주소;
            const name = item.산후조리원;

            if (!address || !name) return;

            geocoder.addressSearch(address, (result, status) => {
              if (status === kakao.maps.services.Status.OK) {
                const coords = new kakao.maps.LatLng(result[0].y, result[0].x);

                const marker = new kakao.maps.Marker({ position: coords });
                const infowindow = new kakao.maps.InfoWindow({
                  content: `<div style="padding:5px;font-size:12px;">${name}</div>`,
                });

                kakao.maps.event.addListener(marker, "mouseover", () => {
                  infowindow.open(map, marker);
                });
                kakao.maps.event.addListener(marker, "mouseout", () => {
                  infowindow.close();
                });

                markers.push(marker);
                clusterer.addMarker(marker);
              }
            });
          });
        });
    </script>
  </body>
</html>
